<!DOCTYPE html>
<html lang="en" data-brand="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backburner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wdth,wght@62..125,100..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ECEBE8; --panel:#E0DFDB; --ink:#1D1F22; --muted:#62676C; --line:#C9C7C2; --accent:#1D1F22;
    --serif:"EB Garamond", Georgia, "Times New Roman", serif;
    --round:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --soft:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --lux:"Cormorant Garamond","EB Garamond",Georgia,serif;
    --type:"Courier Prime","Courier New",monospace;
    --plain:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body:var(--plain); --display:var(--plain);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-brand="ria"]{--bg:#F6F6F4;--panel:#ECECE9;--ink:#0D0D0D;--muted:#5F5F5C;--line:#CFCFCA;--accent:#0D0D0D;--body:var(--lux);--display:var(--lux);}
  :root[data-brand="hathi"]{--bg:#C3A181;--panel:#D3B797;--ink:#2A1B10;--muted:#553D2B;--line:#A68663;--accent:#7A4A22;--body:var(--soft);--display:var(--round);}
  :root[data-brand="chop"]{--bg:#E6E8E6;--panel:#D5D9D6;--ink:#1C2428;--muted:#515C60;--line:#B9C0BD;--accent:#1F6454;--body:var(--plain);--display:"Archivo","Arial Narrow",Arial,sans-serif;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#17181A;--panel:#202224;--ink:#ECEBE8;--muted:#9A9EA3;--line:#35373A;--accent:#ECEBE8;}
    :root:not([data-theme="light"])[data-brand="ria"]{--bg:#0B0B0B;--panel:#161616;--ink:#EDEDEA;--muted:#9B9B97;--line:#2A2A2A;--accent:#EDEDEA;}
    :root:not([data-theme="light"])[data-brand="chop"]{--bg:#12181B;--panel:#1B2327;--ink:#E6ECEA;--muted:#93A19F;--line:#2D3A3E;--accent:#5CC4A6;}
    :root:not([data-theme="light"])[data-brand="hathi"]{--bg:#241912;--panel:#30221A;--ink:#F1E3CD;--muted:#BFA88C;--line:#4A3628;--accent:#E0AC4A;}
  }
  :root[data-theme="dark"]{--bg:#17181A;--panel:#202224;--ink:#ECEBE8;--muted:#9A9EA3;--line:#35373A;--accent:#ECEBE8;}
  :root[data-theme="dark"][data-brand="ria"]{--bg:#0B0B0B;--panel:#161616;--ink:#EDEDEA;--muted:#9B9B97;--line:#2A2A2A;--accent:#EDEDEA;}
  :root[data-theme="dark"][data-brand="chop"]{--bg:#12181B;--panel:#1B2327;--ink:#E6ECEA;--muted:#93A19F;--line:#2D3A3E;--accent:#5CC4A6;}
  :root[data-theme="dark"][data-brand="hathi"]{--bg:#241912;--panel:#30221A;--ink:#F1E3CD;--muted:#BFA88C;--line:#4A3628;--accent:#E0AC4A;}

  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;}
  :root[data-brand="ria"] body{font-size:22px;line-height:1.5;}
  a{color:inherit;}
  a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;}
  .top{padding:22px 0;font-size:15px;font-family:var(--plain);}
  .top a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;}
  h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;}
  p{margin:0 0 1em;max-width:60ch;}
  section{padding:56px 0;border-top:1px solid var(--line);}
  .sub{color:var(--muted);margin:10px 0 28px;max-width:56ch;}
  footer{padding:36px 0 56px;color:var(--muted);font-size:14px;font-family:var(--plain);border-top:1px solid var(--line);}

  /* HOME */
  .home h1{font:600 clamp(40px,8vw,72px)/1 var(--plain);letter-spacing:-0.02em;padding:36px 0 10px;}
  .home .sub{margin-bottom:40px;}
  .tile{display:block;text-decoration:none;padding:34px 0;border-top:1px solid var(--line);}
  .tile:last-of-type{border-bottom:1px solid var(--line);}
  .tile b{display:block;font-size:clamp(34px,7vw,60px);line-height:1.05;font-weight:500;}
  .tile span{display:block;margin-top:8px;color:var(--muted);}
  .tile.ria b{font-family:var(--lux);font-weight:300;font-style:italic;}
  .tile.hathi b{font-family:var(--round);font-weight:800;}
  .tile.chop b{font-family:'Archivo','Arial Narrow',Arial,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-0.02em;}
  .tile:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;}

  /* RIA */
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 70px;}
  .hero h1{font-size:clamp(46px,8vw,94px);line-height:.98;letter-spacing:-0.01em;margin-bottom:22px;}
  .hero p.lede{font-size:23px;color:var(--muted);}
  .hero .coin{width:100%;max-width:380px;justify-self:center;filter:drop-shadow(0 22px 26px rgba(0,0,0,.32));}
  @media (prefers-reduced-motion:no-preference){
    .hero .coin{animation:strike .9s cubic-bezier(.2,.8,.2,1) both;}
    @keyframes strike{from{transform:translateY(-26px) scale(1.06) rotate(-4deg);opacity:0;}to{transform:none;opacity:1;}}
  }
  .coin{display:block;height:auto;}
  h2.big{font-size:clamp(32px,5vw,50px);line-height:1.05;}
  .tray{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:40px;}
  .tray button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 6px 12px;color:inherit;cursor:pointer;text-align:center;font:inherit;}
  .tray button[aria-pressed="true"]{border-bottom-color:var(--accent);}
  .tray svg{width:100%;max-width:130px;margin:0 auto 8px;}
  .tray small{display:block;font-size:17px;line-height:1.2;}
  .panel{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start;}
  .panel .coin{width:100%;filter:drop-shadow(0 16px 18px rgba(0,0,0,.28));}
  .panel h3{font-size:clamp(34px,5vw,52px);line-height:1;}
  .role{color:var(--muted);font-style:italic;margin:8px 0 22px;}
  .tag{display:inline-block;font-family:var(--plain);font-size:14px;padding:3px 10px;border:1.5px solid var(--accent);color:var(--accent);margin-bottom:18px;}
  .direction{border-left:3px solid var(--accent);padding-left:16px;margin-top:22px;max-width:52ch;}
  .direction i{color:var(--muted);}
  .mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 44px;margin:0;}
  .mats div{border-top:1px solid var(--line);padding:16px 0 18px;}
  .mats dt{font-size:26px;line-height:1.1;font-weight:500;}
  .mats dd{margin:4px 0 0;color:var(--muted);}
  .sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;}
  .sheet h3{font-size:26px;margin-bottom:10px;}
  .sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .sw i{display:block;width:64px;height:64px;border:1px solid var(--line);}
  .swn{font-family:var(--plain);font-size:13px;color:var(--muted);}
  .twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px;}

  /* HATHI */
  .hhero{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center;padding:30px 0 70px;}
  .hhero img{width:100%;max-width:420px;border-radius:34px;justify-self:center;box-shadow:0 18px 40px rgba(42,27,16,.28);}
  .hhero h1{font-size:clamp(48px,9vw,100px);line-height:.92;font-weight:800;margin-bottom:18px;}
  .hhero p.lede{font-size:21px;}
  .soaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;}
  .soap{padding:30px 26px 34px;border-radius:26px;color:#2A1B10;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;}
  .soap h3{font-size:34px;line-height:1.02;font-weight:700;}
  .soap p{margin:10px 0 0;}
  .labels .lab{height:180px;border-radius:20px;border:1px solid var(--line);}
  .lab.gold{background:radial-gradient(circle at 50% 50%,#FBF0CF 0 15%,#8A5A33 15% 17%,transparent 17%),repeating-conic-gradient(from 0deg at 50% 50%,#B5832A 0 12deg,#E6C676 12deg 24deg);}
  .lab.line{background:radial-gradient(circle at 50% 50%,#F5F0E6 0 15%,#1E1E1E 15% 17%,transparent 17%),repeating-linear-gradient(45deg,#1E1E1E 0 3px,#ECE7DC 3px 9px);}
  .hhero ~ section h2,.hsec h2{font-size:clamp(34px,5vw,52px);line-height:1.02;font-weight:800;}


  .tag2{font:800 clamp(24px,4vw,34px)/1.1 var(--round);margin:0 0 16px;color:var(--accent);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;}
  .card{border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;}
  .band{position:relative;padding:20px 20px 24px;color:#2A1B10;min-height:132px;}
  .band small{display:block;font:700 14px var(--soft);}
  .band h3{font-size:36px;line-height:1;font-weight:800;margin-top:6px;padding-right:84px;}
  .stamp{position:absolute;top:16px;right:16px;width:64px;height:64px;background:var(--logo) -5px 6px / 73px auto no-repeat,#C3A181;border:2px dashed rgba(42,27,16,.85);}
  .cbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .cbody i{font-style:normal;font:700 13px var(--soft);color:var(--muted);}
  .cbody b{font:700 22px/1.2 var(--round);}
  .cbody p{margin:8px 0 14px;font-size:16px;}
  .st{align-self:flex-start;margin-top:auto;font:700 13px var(--soft);padding:2px 10px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);}
  .hsec p.big2{font-size:21px;}

  .cap{font:400 14px/1.4 var(--type);letter-spacing:.02em;color:var(--muted);display:block;}
  .rhero{background:#0B0B0B;color:#EDEDEA;overflow:hidden;}
  .rhero-in{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;min-height:640px;padding-top:26px;padding-bottom:40px;}
  .rback{font:400 14px var(--type);color:#9B9B97;text-decoration:none;border-bottom:1px solid #3A3A3A;padding-bottom:2px;}
  .logo{display:block;height:auto;color:inherit;}
  .rhero .logo{width:min(400px,100%);margin:56px 0 34px;color:#EDEDEA;}
  .rtag{font:300 clamp(30px,4.4vw,48px)/1.08 var(--lux);font-style:italic;max-width:15ch;margin:0 0 22px;}
  .rhero .print{width:min(600px,118%);justify-self:end;margin-right:-70px;filter:invert(1);}
  .rsec{padding:84px 0;border-top:1px solid var(--line);}
  .rsec h2{font:300 clamp(38px,6vw,68px)/1.02 var(--lux);letter-spacing:-0.01em;max-width:16ch;}
  .rsec p{font-size:22px;}
  .rsec .sub{margin:0 0 6px;}
  .rh3{font:400 34px/1.1 var(--lux);font-style:italic;margin:0 0 10px;}
  .crafts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 56px;margin-top:44px;}
  .crafts>div{border-top:1px solid var(--line);padding:22px 0 30px;}
  .crafts h3{font:400 32px/1.1 var(--lux);margin:6px 0 8px;}
  .crafts p{font-size:19px;color:var(--muted);margin:0;}
  .swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:44px;}
  .swatches figure{margin:0;}
  .swatches figcaption{margin-top:10px;}
  .swa{position:relative;height:300px;overflow:hidden;background:#F6F6F4;border:1px solid var(--line);}
  .sw-coin{background:#0B0B0B var(--p-coin) center/84% auto no-repeat;}
  .sw-coin{background-blend-mode:normal;}
  .sw-band{background:var(--p-band) 0 0/320px auto repeat,#F6F6F4;}
  .sw-field{background:#0B0B0B;}
  .fieldbg{position:absolute;inset:0;background:var(--p-field) 0 0/170px 170px repeat;filter:invert(1);}
  .rsec .mats{margin-top:28px;}
  .rsec .mats dt{font:400 30px/1.1 var(--lux);}
  .rsec .mats dd{font-size:19px;font-style:italic;}
  .rtable{margin-top:28px;}
  .rrow{display:grid;grid-template-columns:90px 1.1fr 1.6fr 1.1fr;gap:24px;padding:22px 0;border-top:1px solid var(--line);align-items:start;}
  .rrow b{display:block;font:400 30px/1.1 var(--lux);}
  .rrow p{margin:0;font-size:19px;max-width:none;}
  .rrow .sc{font-style:italic;color:var(--muted);}
  .lsplit{display:grid;grid-template-columns:1fr 360px;gap:56px;align-items:center;}
  .label{background:#F6F6F4;color:#0D0D0D;border:1px solid #0D0D0D;padding:38px 26px;text-align:center;font:400 15px/1.7 var(--type);box-shadow:0 18px 30px rgba(0,0,0,.18);}
  .label b{display:block;font:700 22px var(--type);letter-spacing:.04em;}
  .label span{display:block;}
  .label hr{border:0;border-top:1px solid #0D0D0D;margin:16px 0;}
  .logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:36px;}
  .lg{margin:0;padding:40px 28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:30px;min-height:300px;}
  .lg.light{background:#F6F6F4;color:#0D0D0D;border:1px solid var(--line);}
  .lg.dark{background:#0B0B0B;color:#EDEDEA;}
  .lg.light .cap{color:#5F5F5C;}.lg.dark .cap{color:#9B9B97;}
  .lg .logo{width:100%;max-width:240px;}
  .lg .seal{max-width:200px;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  .csec h2,.chero h1{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:-0.02em;}
  .csec h2{font-size:clamp(28px,4.6vw,46px);line-height:1.05;}
  .chero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:30px 0 72px;}
  .chero h1{font-size:clamp(38px,6.6vw,78px);line-height:.98;margin-bottom:22px;}
  .chero .lede{font-size:20px;color:var(--muted);}
  .chero .line{font-style:italic;color:var(--accent);font-weight:600;}
  .chero .stat{margin-top:18px;padding-left:14px;border-left:3px solid var(--accent);color:var(--muted);font-size:16px;}
  .slab{background:#1C2428;color:#E6ECEA;border-radius:20px;padding:26px;box-shadow:0 24px 40px rgba(0,0,0,.28);border:1px solid #33424A;}
  .slab small{color:#93A19F;font-size:13px;}
  .slab h3{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:26px;line-height:1.1;margin:6px 0 4px;color:#E6ECEA;}
  .slab .ids{font-size:13px;color:#93A19F;margin-bottom:20px;}
  .tapbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #5CC4A6;background:transparent;color:#5CC4A6;font:600 17px var(--plain);cursor:pointer;}
  .tapbtn:hover{background:rgba(92,196,166,.1);}
  .tapbtn svg{flex:none;}
  .verified{display:none;margin-top:18px;}
  .slab.on .verified{display:block;}
  .vchip{display:inline-block;font:600 13px var(--plain);padding:3px 10px;border-radius:999px;background:#5CC4A6;color:#102A22;margin-bottom:14px;}
  .hist{list-style:none;margin:0;padding:0;}
  .hist li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid #33424A;}
  .hist b{display:block;font-weight:600;}
  .hist span{color:#93A19F;font-size:15px;line-height:1.4;display:block;}
  @media (prefers-reduced-motion:no-preference){
    .slab.on .hist li{animation:punch .45s cubic-bezier(.2,.9,.3,1.2) both;}
    .slab.on .hist li:nth-child(2){animation-delay:.25s;}
    .slab.on .hist li:nth-child(3){animation-delay:.5s;}
    @keyframes punch{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  }
  .chopcoin{width:100%;max-width:300px;filter:drop-shadow(0 16px 20px rgba(0,0,0,.3));}
  .split{display:grid;grid-template-columns:1fr 300px;gap:48px;align-items:center;}
  .cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;}
  .cols2 h3{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:22px;margin-bottom:12px;}
  .cols2 ul,.plainlist{margin:0;padding-left:20px;}
  .cols2 li,.plainlist li{margin-bottom:10px;max-width:56ch;}
  .csec .mats dt{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:21px;line-height:1.15;}
  .cats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .cats span{border:1.5px solid var(--ink);padding:5px 14px;font-weight:500;}
  .tblwrap{overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;min-width:420px;}
  .tbl th,.tbl td{text-align:left;padding:12px 10px 12px 0;border-top:1px solid var(--line);}
  .tbl th{font-weight:600;color:var(--muted);font-size:15px;}
  .rows div{display:flex;justify-content:space-between;gap:24px;padding:18px 0;border-top:1px solid var(--line);}
  .rows b{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:22px;white-space:nowrap;}
  .rows span{max-width:46ch;}
  .rows em{font-style:normal;font-weight:600;display:block;}
  .note{font-size:14px;color:var(--muted);margin-top:16px;}
  @media (max-width:760px){
    .hero,.hhero,.panel,.chero,.split,.rhero-in,.lsplit{grid-template-columns:1fr;}
    .rhero .print{width:100%;margin:0;justify-self:center;}
    .rrow{grid-template-columns:1fr;gap:6px;}
    .rows div{flex-direction:column;gap:6px;}
    .panel .coin{max-width:260px;}
    .tray{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- shared helpers ---------------- */
const topbar = '<div class="wrap top"><a href="#/">Backburner</a></div>';

  '<div class="swatches"><figure><div class="swa sw-coin"></div><figcaption class="cap">Impression</figcaption></figure>'+
  '<figure><div class="swa sw-band"></div><figcaption class="cap">Band</figcaption></figure>'+
  '<figure><div class="swa sw-field"><div class="fieldbg"></div></div><figcaption class="cap">Field</figcaption></figure></div></div></section>'+

  '<section class="rsec"><div class="wrap"><h2>The collection</h2><p class="sub"></p>'+
  '<h3 class="rh3">Core</h3><p>Fragrances built on Indian raw materials. In development.</p>'+
  '<dl class="mats">'+MATERIALS.map(m=>'<div><dt>'+m[0]+'</dt><dd>'+m[1]+'</dd></div>').join('')+'</dl>'+
  '<h3 class="rh3" style="margin-top:56px">The Rulers</h3><p>A side series. Each fragrance is named for a ruler of South Asia and built from what that person is remembered for. The coin on the packet is the seal.</p>'+
  '<div class="rtable">'+RULERS.map(r=>'<div class="rrow"><div class="cap">'+r.no+'<br>'+r.status+'</div><div><b>'+r.name+'</b><span class="cap">'+r.role+'</span></div><p>'+r.story+'</p><p class="sc">'+r.scent+'</p></div>').join('')+'</div></div></section>'+

  '<section class="rsec"><div class="wrap"><div class="lsplit"><div><h2>The label</h2><p class="sub"></p>'+
  '<p>Every bottle carries a typewritten label, like a prescription. It names the fragrance, the batch, and the person who made it.</p></div>'+
  '<div class="label"><b>SHAH JAHAN</b><span>No. 1</span><span>FRAGRANCE · [ML]</span><hr>'+
  '<span>Made by [maker’s name]</span><span>[Town], India</span><span>Batch [00] · [Date]</span><hr>'+
  '<span>ROYAL INDIAN APOTHECARY</span></div></div></div></section>'+

  '<section class="rsec"><div class="wrap"><h2>The brand</h2><p class="sub"></p>'+
  '<div class="logos"><figure class="lg light">'+lockup()+'<figcaption class="cap">Primary</figcaption></figure>'+
  '<figure class="lg dark">'+seal()+'<figcaption class="cap">Seal, for labels and stamps</figcaption></figure>'+
  '<figure class="lg light">'+wordmark()+'<figcaption class="cap">Wordmark</figcaption></figure></div>'+
  '<div class="sheet" style="margin-top:48px">'+
  '<div><h3>Line</h3><p>Perfume from the hands of Indian artisans.</p></div>'+
  '<div><h3>Palette</h3><div class="sw"><i style="background:#0D0D0D"></i><i style="background:#F6F6F4"></i><i style="background:#9B9B97"></i></div><div class="swn">Black, paper, grey. The print carries the rest.</div></div>'+
  '<div><h3>Type</h3><p>Cormorant Garamond for names and text. Courier Prime for labels, numbers, and details.</p></div>'+
  '<div><h3>Packaging</h3><p>A wrap in the coin print, a paper band with the number and name in typewriter type, and a coin pressed on the front.</p></div>'+
  '<div><h3>Voice</h3><p>Quiet and exact. Name the material, the maker, and the place.</p></div>'+
  '</div></div></section>'+foot; },

}

  '<li>Pricing is fluid. Dealers keep repricing against eBay, TCGPlayer, and the market.</li>'+
  '<li>No storefront of their own, so they sell through eBay, Instagram DMs, or middlemen.</li>'+
  '<li>No central record. Provenance, condition, and sale history live in notebooks, photos, and memory.</li>'+
  '<li>Show prep is painful: re-stickering hundreds of items with Excel and sticker guns.</li>'+
  '<li>In-person trust is brittle, with no comps, fraud protection, or digital trail.</li></ul></div>'+
  '<div><h3>For collectors</h3><ul>'+
  '<li>No way to verify provenance or comps in person.</li>'+
  '<li>No portable portfolio. The collection lives in boxes, not apps.</li>'+
  '<li>No shared language of authenticity. Grades, prices, and trust vary wildly.</li></ul></div></div>'+
  '<p style="margin-top:28px">There is no unified infrastructure to catalog, price, and verify physical collectibles, or to give creators and dealers a real platform of their own.</p></div></section>'+

  '<section class="csec"><div class="wrap"><h2>What we’re building</h2><p class="sub">Trust, identity, and tools for the physical world.</p>'+
  '<dl class="mats">'+
  '<div><dt>GOID</dt><dd>A Global Object ID: a permanent, scannable identity for each collectible, with provenance, pricing, and history in one place.</dd></div>'+
  '<div><dt>Scan to verify</dt><dd>Tap or scan an item at a show to see pricing, ownership history, and item details.</dd></div>'+
  '<div><dt>Dealer toolkit</dt><dd>Inventory management, label printing, bulk import, NFC tagging, and show pricing.</dd></div>'+
  '<div><dt>Your storefront</dt><dd>Customizable pages for dealers and artists.</dd></div>'+
  '<div><dt>The registry</dt><dd>A shared database of collectible types (CHIDs). Structured data you can trust, not crowdsourced guesses.</dd></div>'+
  '<div><dt>Chopmark Atlas</dt><dd>AI-powered research that teaches you about an object from its metadata.</dd></div>'+
  '<div><dt>Image verification</dt><dd>Take a photo and check that it matches the image on record.</dd></div>'+
  '</dl></div></section>'+

  '<section class="csec"><div class="wrap"><h2>Where it stands out</h2><p class="sub">One platform across every kind of collectible, built for the people who trade them.</p>'+
  '<div class="tblwrap"><div class="cats"><span>Coins</span><span>Cards</span><span>Comics</span><span>Stamps</span><span>Art</span><span>Watches</span></div></div>'+
  '<p style="margin-top:26px">Every item has a type (CHID) and a unique identity (GOID). Provenance travels with the item through NFC and QR labels. Valuation pulls from eBay, TCGPlayer, WatchCharts, and CoinArchives. Dealers get label printing, repricing, bulk import, and a show mode.</p></div></section>'+

  '<section class="csec"><div class="wrap"><h2>The market</h2><p class="sub">The global collectibles market was about $512B in 2025 and is projected to grow roughly 6.2% a year. There are more than 50,000 coin, card, and watch dealers in the U.S. alone.</p>'+
  '<div class="tblwrap"><table class="tbl"><thead><tr><th>Segment</th><th>2025 size</th><th>Growth a year</th></tr></thead><tbody>'+
  '<tr><td>Coins</td><td>$38.4B</td><td>8.1%</td></tr>'+
  '<tr><td>Trading cards</td><td>$13B</td><td>8.5%</td></tr>'+
  '<tr><td>Comic books</td><td>$28.7B</td><td>5.3%</td></tr>'+
  '<tr><td>Stamps</td><td>$234.9M</td><td>4.65%</td></tr>'+
  '<tr><td>Digital collectibles</td><td>$10.9B</td><td>17.3%</td></tr></tbody></table></div>'+
  '<p class="note">Figures from the Chopmark pitch deck, citing Market Decipher (2025).</p></div></section>'+

  '<section class="csec"><div class="wrap"><h2>How it makes money</h2><p class="sub">Collectors get free or low-cost cataloging, scanning, and trading, with premium features for enthusiasts. Dealers pay.</p><div class="rows">'+
  '<div><span><em>Dealer subscriptions</em>Advanced tools for inventory, repricing, and marketplace access.</span><b>$10 to $50 a month</b></div>'+
  '<div><span><em>Premium labels</em>Custom NFC and QR labels for show-based trading.</span><b>$5 to $20 a batch</b></div>'+
  '<div><span><em>Marketplace fees</em>A cut of online peer-to-peer sales.</span><b>2 to 5% a sale</b></div>'+
  '</div></div></section>'+

  '<section class="csec"><div class="wrap"><h2>Go-to-market</h2><p class="sub"></p><div class="cols2">'+
  '<div><h3>Phase 1: Founder as dealer</h3><p>Set up Chopmark-tagged inventory at coin and card shows. Demo real NFC and QR labels, the scan experience, and pricing comps. Build credibility, not just users.</p></div>'+
  '<div><h3>Phase 2: Dealer splinter cells</h3><p>Onboard 3 to 5 trusted dealers across coins, comics, cards, and watches, with white-glove setup. Their shops and posts become the social proof.</p></div>'+
  '<div><h3>Phase 3: Collector app</h3><p>Launch a streamlined scan and collection view for buyers: tap to view, tap to share.</p></div>'+
  '</div></div></section>'+

    '<section class="csec"><div class="wrap"><h2>Where it stands</h2><p class="sub">Shelved. Chopmark was designed and pitched, but never built.</p><div class="cols2">'+
  '<div><h3>What exists</h3><ul>'+
  '<li>A pitch deck covering the problem, product, market, and go-to-market plan.</li>'+
  '<li>A designed data model: CHID, GOID, TapLogs, and valuation.</li>'+
  '<li>NFC and QR tagging and scan logging, specced on paper.</li>'+
  '<li>A mapped competitor landscape.</li></ul></div>'+
  '<div><h3>What didn’t happen</h3><ul>'+
  '<li>The trademark application was filed April 21, 2025, in Classes 9, 35, 41, and 42. The statement of use was never filed, so it never registered.</li>'+
  '<li>No part of the MVP was built: the GOID and CHID wizard, dealer tools, tap-to-scan, DealerShops, valuation, and CSV import.</li></ul></div></div></div></section>'+

'<section class="csec"><div class="wrap"><h2>The brand</h2><p class="sub"></p><div class="sheet">'+
  '<div><h3>Name</h3><p>Chopmark</p><h3>Line</h3><p>Tag it. Track it. Trust it.</p></div>'+
  '<div><h3>Palette</h3><div class="sw"><i style="background:#1C2428"></i><i style="background:#2F7D6B"></i><i style="background:#A67C2A"></i><i style="background:#E6E8E6"></i></div><div class="swn">Gunmetal, verdigris, brass, pewter</div></div>'+
  '<div><h3>Type</h3><p>Archivo, set wide, for headlines. IBM Plex Sans for text. IBM Plex Mono for IDs like GOIDs and CHIDs.</p></div>'+
  '<div><h3>Mark</h3><p>The chop itself: a small punched square, circle, or hexagon, each with its own cut.</p></div>'+
  '<div><h3>Voice</h3><p>Plain and exact. Say what the record shows.</p></div>'+
  '</div></div></section>'+foot; },
  init(){
    const slab=document.getElementById('slab'), tap=document.getElementById('tap'), tx=document.getElementById('taptxt');
    tap.addEventListener('click',()=>{
      const on=slab.classList.toggle('on');
      tx.textContent = on ? 'Scan again' : 'Tap to verify';
    });
  }
};

/* ---------------- HOME + ROUTER ---------------- */
const homePage = {
  title:'Backburner',
  html(){ return '<div class="wrap home"><h1>Backburner</h1><p class="sub">Companies started and kept in reserve. One page each.</p>'+
  '<a class="tile chop" href="#/chopmark"><b>Chopmark</b><span>The Carfax for collectibles.</span></a>'+
  '<a class="tile hathi" href="#/hathi"><b>Happy Hathi</b><span>Soap, one color per bar.</span></a>'+
  '<a class="tile ria" href="#/ria"><b>Royal Indian Apothecary</b><span>Premium fragrance, made by Indian artisans.</span></a></div>'+foot; }
};
const PAGES = { home:homePage, ria:riaPage, hathi:hathiPage, chopmark:chopPage };
function render(){
  const key = location.hash.replace(/^#\/?/,'') || 'home';
  const page = PAGES[key] || homePage;
  const brand = PAGES[key] ? (key==='chopmark' ? 'chop' : key) : 'home';
  document.documentElement.setAttribute('data-brand', brand);
  document.getElementById('app').innerHTML = page.html();
  document.title = page.title;
  window.scrollTo(0,0);
  if (page.init) page.init();
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
